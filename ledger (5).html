<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cord &amp; Emily — The Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEE8DA;
    --paper-raised: #F6F1E6;
    --paper-row: #E4DCC8;
    --ink: #23303F;
    --ink-soft: #5B6472;
    --rule: #C6BB9F;
    --rule-strong: #A79A78;
    --cord: #2E6B6C;
    --cord-soft: #DCEBE8;
    --emily: #8C3F5D;
    --emily-soft: #F2DEE5;
    --gold: #A97726;
    --danger: #A23B2E;
    --radius: 3px;
    --shadow: 0 1px 0 rgba(35,48,63,0.06);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-variant-numeric: tabular-nums;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ---------- Masthead ---------- */
  .masthead {
    text-align: center;
    padding-bottom: 22px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 28px;
  }

  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2.1rem;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }

  .masthead .names {
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }

  .names .who-cord { color: var(--cord); font-weight: 600; }
  .names .who-emily { color: var(--emily); font-weight: 600; }

  .balance-stamp {
    display: inline-block;
    padding: 14px 30px;
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    background: var(--paper-raised);
    position: relative;
  }

  .balance-stamp .figure {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 2.4rem;
    line-height: 1.1;
  }

  .balance-stamp .figure.owes-cord { color: var(--cord); }
  .balance-stamp .figure.owes-emily { color: var(--emily); }
  .balance-stamp .figure.settled { color: var(--gold); }

  .balance-stamp .caption {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 16px;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }

  .stats-row b { color: var(--ink); font-weight: 600; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 0;
  }

  .tab-btn {
    flex: 1;
    padding: 11px 14px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    border: 1px solid var(--rule-strong);
    border-bottom: none;
    background: var(--paper-row);
    color: var(--ink-soft);
    cursor: pointer;
    border-top-left-radius: var(--radius);
    border-top-right-radius: var(--radius);
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab-btn.active {
    background: var(--paper-raised);
    color: var(--ink);
    font-weight: 600;
  }

  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--rule-strong);
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 20px;
    margin-bottom: 34px;
  }

  .panel form { display: none; }
  .panel form.active { display: block; }

  .field-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .field {
    flex: 1;
    min-width: 140px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .field input {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.95rem;
    padding: 9px 10px;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    background: #fff;
    color: var(--ink);
  }

  .field input:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .person-toggle {
    display: flex;
    gap: 8px;
  }

  .person-toggle button {
    flex: 1;
    padding: 9px 10px;
    border-radius: var(--radius);
    border: 1.5px solid var(--rule-strong);
    background: #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all 0.12s ease;
  }

  .person-toggle button[data-person="Cord"].selected {
    background: var(--cord);
    border-color: var(--cord);
    color: #fff;
  }

  .person-toggle button[data-person="Emily"].selected {
    background: var(--emily);
    border-color: var(--emily);
    color: #fff;
  }

  .settle-note {
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin: -4px 0 14px;
  }

  .submit-btn {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: var(--radius);
    background: var(--ink);
    color: var(--paper-raised);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .submit-btn:hover { background: #1a242f; }

  .form-msg {
    font-size: 0.82rem;
    margin-top: 10px;
    color: var(--danger);
    min-height: 1em;
  }

  /* ---------- Table ---------- */
  .ledger-section h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.2rem;
    margin: 0 0 14px;
  }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .filter-toggle {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-toggle button {
    padding: 6px 12px;
    border-radius: 14px;
    border: 1px solid var(--rule-strong);
    background: var(--paper-raised);
    color: var(--ink-soft);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s ease;
  }

  .filter-toggle button.selected {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper-raised);
  }

  .custom-range {
    display: flex;
    gap: 10px;
  }

  .custom-range .field {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }

  .custom-range label {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .custom-range input {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.85rem;
    padding: 5px 7px;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    background: #fff;
    color: var(--ink);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  thead th {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 2px solid var(--ink);
    font-weight: 600;
    font-size: 0.78rem;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  thead th:hover { color: var(--ink); }

  thead th .arrow { font-size: 0.72rem; margin-left: 3px; opacity: 0.7; }

  tbody td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }

  tbody tr:nth-child(even) { background: rgba(198,187,159,0.18); }

  .who-cell .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }

  .dot-cord { background: var(--cord); }
  .dot-emily { background: var(--emily); }

  .who-cell.settlement { font-weight: 500; }

  td.amount { text-align: right; font-weight: 500; }
  th.amount-col { text-align: right; }

  td.note-col { color: var(--ink-soft); max-width: 220px; }

  .del-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 0.95rem;
    padding: 0 4px;
    line-height: 1;
  }

  .del-btn:hover { color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 30px 10px;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .footer-row {
    margin-top: 24px;
    text-align: center;
  }

  .footer-row button {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 0.78rem;
    text-decoration: underline;
    cursor: pointer;
  }

  .footer-row button:hover { color: var(--danger); }

  .load-msg {
    text-align: center;
    padding: 40px 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  @media (max-width: 480px) {
    .balance-stamp .figure { font-size: 1.9rem; }
    thead th:nth-child(4), tbody td:nth-child(4) { display: none; } /* hide note col on tiny screens */
    .stats-row { flex-direction: column; gap: 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  .gate-overlay {
    position: fixed;
    inset: 0;
    background: var(--ink);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .gate-box {
    background: var(--paper-raised);
    border-radius: var(--radius);
    padding: 32px 28px;
    max-width: 320px;
    width: 100%;
    text-align: center;
  }

  .gate-box h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.3rem;
    margin: 0 0 16px;
    color: var(--ink);
  }

  .gate-box input {
    width: 100%;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.95rem;
    padding: 10px;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    margin-bottom: 12px;
    text-align: center;
  }

  .gate-box input:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .gate-box button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: var(--radius);
    background: var(--ink);
    color: var(--paper-raised);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
  }

  .gate-box button:hover { background: #1a242f; }

  .gate-msg {
    font-size: 0.8rem;
    color: var(--danger);
    margin-top: 10px;
    min-height: 1em;
  }
</style>
</head>
<body>

<div id="gateOverlay" class="gate-overlay">
  <div class="gate-box">
    <h2>The Ledger</h2>
    <input type="password" id="gatePassword" placeholder="Password" autocomplete="off">
    <button id="gateSubmit" type="button">Unlock</button>
    <div class="gate-msg" id="gateMsg"></div>
  </div>
</div>

<script>
(function () {
  var PASSWORD = 'june21';
  var overlay = document.getElementById('gateOverlay');
  if (localStorage.getItem('ledger-unlocked') === 'true') {
    overlay.style.display = 'none';
  }
  function tryUnlock() {
    var input = document.getElementById('gatePassword');
    if (input.value === PASSWORD) {
      localStorage.setItem('ledger-unlocked', 'true');
      overlay.style.display = 'none';
    } else {
      document.getElementById('gateMsg').textContent = 'Incorrect password.';
      input.value = '';
    }
  }
  document.getElementById('gateSubmit').addEventListener('click', tryUnlock);
  document.getElementById('gatePassword').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryUnlock();
  });
})();
</script>
<div class="wrap">

  <div class="masthead">
    <h1>The Ledger</h1>
    <div class="names"><span class="who-cord">Cord</span> &amp; <span class="who-emily">Emily</span></div>
    <div class="balance-stamp">
      <div class="figure" id="balanceFigure">—</div>
      <div class="caption" id="balanceCaption">loading…</div>
    </div>
    <div class="stats-row" id="statsRow"></div>
  </div>

  <div id="app-body" style="display:none;">

    <div class="tabs">
      <button class="tab-btn active" data-tab="purchase">Log a purchase</button>
      <button class="tab-btn" data-tab="settlement">Record a payment</button>
    </div>

    <div class="panel">
      <form id="purchaseForm" class="active">
        <div class="field-row">
          <div class="field">
            <label>Who paid?</label>
            <div class="person-toggle" id="purchasePersonToggle">
              <button type="button" data-person="Cord" class="selected">Cord</button>
              <button type="button" data-person="Emily">Emily</button>
            </div>
          </div>
          <div class="field">
            <label for="purchaseAmount">Cost ($)</label>
            <input type="number" id="purchaseAmount" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div class="field">
            <label for="purchaseDate">Date</label>
            <input type="date" id="purchaseDate" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field" style="flex: 2 1 auto;">
            <label for="purchaseNote">What was it for? (optional)</label>
            <input type="text" id="purchaseNote" placeholder="e.g. groceries, dinner out">
          </div>
        </div>
        <button type="submit" class="submit-btn">Add purchase</button>
        <div class="form-msg" id="purchaseMsg"></div>
      </form>

      <form id="settlementForm">
        <div class="field-row">
          <div class="field">
            <label>Who's sending money?</label>
            <div class="person-toggle" id="settlePersonToggle">
              <button type="button" data-person="Cord" class="selected">Cord</button>
              <button type="button" data-person="Emily">Emily</button>
            </div>
          </div>
          <div class="field">
            <label for="settleAmount">Amount ($)</label>
            <input type="number" id="settleAmount" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div class="field">
            <label for="settleDate">Date</label>
            <input type="date" id="settleDate" required>
          </div>
        </div>
        <div class="settle-note" id="settleDirectionNote">Cord → Emily</div>
        <div class="field-row">
          <div class="field" style="flex: 2 1 auto;">
            <label for="settleNote">Note (optional)</label>
            <input type="text" id="settleNote" placeholder="e.g. Venmo, cash">
          </div>
        </div>
        <button type="submit" class="submit-btn">Record payment</button>
        <div class="form-msg" id="settleMsg"></div>
      </form>
    </div>

    <div class="ledger-section">
      <h2>All entries</h2>
      <div class="filter-row">
        <div class="filter-toggle" id="filterToggle">
          <button type="button" data-range="all">All</button>
          <button type="button" data-range="30d" class="selected">Last 30 days</button>
          <button type="button" data-range="6m">Last 6 months</button>
          <button type="button" data-range="custom">Custom</button>
        </div>
        <div class="custom-range" id="customRange" style="display:none;">
          <div class="field">
            <label for="filterFrom">From</label>
            <input type="date" id="filterFrom">
          </div>
          <div class="field">
            <label for="filterTo">To</label>
            <input type="date" id="filterTo">
          </div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th data-sort="date">Date <span class="arrow" id="arrow-date"></span></th>
            <th data-sort="person">Who <span class="arrow" id="arrow-person"></span></th>
            <th data-sort="amount" class="amount-col">Amount <span class="arrow" id="arrow-amount"></span></th>
            <th>For</th>
            <th style="width:26px;"></th>
          </tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">No entries yet — log your first purchase above.</div>
      <div class="empty-state" id="emptyFilterState" style="display:none;">No entries in this range.</div>
    </div>

  </div>

  <div class="load-msg" id="loadMsg">Opening the ledger…</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

// ------------------------------------------------------------------
// PASTE YOUR FIREBASE CONFIG HERE (Project settings > General > Your apps)
// ------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyB6DsZRH-bfrEhM0RmTtPmvdw9o3TaFRh8",
  authDomain: "cordily-4dbd4.firebaseapp.com",
  projectId: "cordily-4dbd4",
  storageBucket: "cordily-4dbd4.firebasestorage.app",
  messagingSenderId: "244124301921",
  appId: "1:244124301921:web:f8fcf209d3e0d8b785c820",
  measurementId: "G-BTC6KRKZ5E"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const entriesRef = collection(db, "ledger-entries");

(function () {
  var entries = [];
  var sortState = { col: 'date', dir: 'desc' };
  var filterState = { range: '30d', from: '', to: '' };
  var activeTab = 'purchase';
  var purchasePerson = 'Cord';
  var settlePerson = 'Cord';
  var firstSnapshotReceived = false;

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function fmt(n) {
    return '$' + Math.abs(n).toFixed(2);
  }

  // Live-syncs entries from Firestore. Fires immediately with cached/local
  // data, then again whenever a doc changes (added, edited or deleted) —
  // including changes made from the other person's device.
  onSnapshot(entriesRef, function (snapshot) {
    entries = snapshot.docs.map(function (d) {
      return Object.assign({ id: d.id }, d.data());
    });
    renderAll();
    if (!firstSnapshotReceived) {
      firstSnapshotReceived = true;
      document.getElementById('loadMsg').style.display = 'none';
      document.getElementById('app-body').style.display = 'block';
    }
  }, function (err) {
    document.getElementById('loadMsg').textContent =
      'Could not connect to Firebase — check the config at the top of the file and your Firestore security rules.';
  });

  function computeBalance() {
    var d = 0;
    entries.forEach(function (e) {
      if (e.type === 'purchase') {
        d += (e.payer === 'Cord' ? 1 : -1) * (e.amount / 2);
      } else {
        d += (e.from === 'Cord' ? 1 : -1) * e.amount;
      }
    });
    return d;
  }

  function renderBalance() {
    var d = computeBalance();
    var figure = document.getElementById('balanceFigure');
    var caption = document.getElementById('balanceCaption');
    figure.classList.remove('owes-cord', 'owes-emily', 'settled');
    if (Math.abs(d) < 0.005) {
      figure.textContent = '$0.00';
      figure.classList.add('settled');
      caption.textContent = 'all settled up';
    } else if (d > 0) {
      figure.textContent = fmt(d);
      figure.classList.add('owes-cord');
      caption.textContent = 'Emily owes Cord';
    } else {
      figure.textContent = fmt(d);
      figure.classList.add('owes-emily');
      caption.textContent = 'Cord owes Emily';
    }

    var cordSpent = entries.filter(function (e) { return e.type === 'purchase' && e.payer === 'Cord'; })
      .reduce(function (s, e) { return s + e.amount; }, 0);
    var emilySpent = entries.filter(function (e) { return e.type === 'purchase' && e.payer === 'Emily'; })
      .reduce(function (s, e) { return s + e.amount; }, 0);
    var stats = document.getElementById('statsRow');
    if (entries.length === 0) {
      stats.innerHTML = '';
    } else {
      stats.innerHTML =
        '<span>Cord has paid <b>' + fmt(cordSpent) + '</b></span>' +
        '<span>Emily has paid <b>' + fmt(emilySpent) + '</b></span>';
    }
  }

  function personLabel(entry) {
    if (entry.type === 'purchase') {
      var dotClass = entry.payer === 'Cord' ? 'dot-cord' : 'dot-emily';
      return '<span class="dot ' + dotClass + '"></span>' + entry.payer;
    } else {
      var other = entry.from === 'Cord' ? 'Emily' : 'Cord';
      return entry.from + ' → ' + other;
    }
  }

  function sortEntries(list) {
    var col = sortState.col, dir = sortState.dir === 'asc' ? 1 : -1;
    return list.slice().sort(function (a, b) {
      var av, bv;
      if (col === 'date') { av = a.date; bv = b.date; }
      else if (col === 'amount') { av = a.amount; bv = b.amount; }
      else if (col === 'person') {
        av = a.type === 'purchase' ? a.payer : a.from;
        bv = b.type === 'purchase' ? b.payer : b.from;
      }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
  }

  function inRange(entry) {
    if (filterState.range === 'all') return true;
    if (filterState.range === 'custom') {
      if (filterState.from && entry.date < filterState.from) return false;
      if (filterState.to && entry.date > filterState.to) return false;
      return true;
    }
    var days = filterState.range === '30d' ? 30 : 183;
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);
    var cutoffStr = cutoff.toISOString().slice(0, 10);
    return entry.date >= cutoffStr;
  }

  function renderTable() {
    var body = document.getElementById('ledgerBody');
    var empty = document.getElementById('emptyState');
    var emptyFilter = document.getElementById('emptyFilterState');
    body.innerHTML = '';
    empty.style.display = 'none';
    emptyFilter.style.display = 'none';

    if (entries.length === 0) {
      empty.style.display = 'block';
      return;
    }
    var filtered = entries.filter(inRange);
    if (filtered.length === 0) {
      emptyFilter.style.display = 'block';
      return;
    }
    var sorted = sortEntries(filtered);
    sorted.forEach(function (e) {
      var tr = document.createElement('tr');
      var whoClass = e.type === 'settlement' ? 'who-cell settlement' : 'who-cell';
      tr.innerHTML =
        '<td>' + e.date + '</td>' +
        '<td class="' + whoClass + '">' + personLabel(e) + '</td>' +
        '<td class="amount">' + fmt(e.amount) + '</td>' +
        '<td class="note-col">' + (e.note ? escapeHtml(e.note) : '—') + '</td>' +
        '<td><button class="del-btn" data-id="' + e.id + '" title="Delete entry">✕</button></td>';
      body.appendChild(tr);
    });

    ['date', 'person', 'amount'].forEach(function (c) {
      document.getElementById('arrow-' + c).textContent = '';
    });
    document.getElementById('arrow-' + sortState.col).textContent = sortState.dir === 'asc' ? '↑' : '↓';
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function renderAll() {
    renderBalance();
    renderTable();
  }

  // --- Tabs ---
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('purchaseForm').classList.toggle('active', activeTab === 'purchase');
      document.getElementById('settlementForm').classList.toggle('active', activeTab === 'settlement');
    });
  });

  // --- Person toggles ---
  function wireToggle(containerId, onSelect) {
    var container = document.getElementById(containerId);
    container.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        container.querySelectorAll('button').forEach(function (b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        onSelect(btn.dataset.person);
      });
    });
  }

  wireToggle('purchasePersonToggle', function (p) { purchasePerson = p; });
  wireToggle('settlePersonToggle', function (p) {
    settlePerson = p;
    var other = p === 'Cord' ? 'Emily' : 'Cord';
    document.getElementById('settleDirectionNote').textContent = p + ' → ' + other;
  });

  // --- Filter toggle ---
  document.getElementById('filterToggle').querySelectorAll('button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.getElementById('filterToggle').querySelectorAll('button').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      filterState.range = btn.dataset.range;
      document.getElementById('customRange').style.display = filterState.range === 'custom' ? 'flex' : 'none';
      renderTable();
    });
  });

  document.getElementById('filterFrom').addEventListener('change', function () {
    filterState.from = this.value;
    renderTable();
  });

  document.getElementById('filterTo').addEventListener('change', function () {
    filterState.to = this.value;
    renderTable();
  });

  // --- Table sort ---
  document.querySelectorAll('th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var col = th.dataset.sort;
      if (sortState.col === col) {
        sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        sortState.col = col;
        sortState.dir = col === 'amount' ? 'desc' : 'desc';
      }
      renderTable();
    });
  });

  // --- Delete ---
  document.getElementById('ledgerBody').addEventListener('click', async function (ev) {
    var btn = ev.target.closest('.del-btn');
    if (!btn) return;
    if (!confirm('Delete this entry? This can\'t be undone.')) return;
    try {
      await deleteDoc(doc(db, 'ledger-entries', btn.dataset.id));
    } catch (e) {
      alert('Could not delete that entry — check your connection and try again.');
    }
  });

  // --- Purchase form ---
  document.getElementById('purchaseForm').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var msg = document.getElementById('purchaseMsg');
    var amountInput = document.getElementById('purchaseAmount');
    var dateInput = document.getElementById('purchaseDate');
    var noteInput = document.getElementById('purchaseNote');
    var amount = parseFloat(amountInput.value);
    if (!amount || amount <= 0) { msg.textContent = 'Enter a cost greater than $0.'; return; }
    var entry = {
      type: 'purchase',
      payer: purchasePerson,
      amount: Math.round(amount * 100) / 100,
      date: dateInput.value || todayStr(),
      note: noteInput.value.trim(),
      createdAt: Date.now()
    };
    msg.textContent = '';
    try {
      await addDoc(entriesRef, entry);
      amountInput.value = '';
      noteInput.value = '';
    } catch (e) {
      msg.textContent = 'Could not save — check your connection and try again.';
    }
  });

  // --- Settlement form ---
  document.getElementById('settlementForm').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var msg = document.getElementById('settleMsg');
    var amountInput = document.getElementById('settleAmount');
    var dateInput = document.getElementById('settleDate');
    var noteInput = document.getElementById('settleNote');
    var amount = parseFloat(amountInput.value);
    if (!amount || amount <= 0) { msg.textContent = 'Enter an amount greater than $0.'; return; }
    var entry = {
      type: 'settlement',
      from: settlePerson,
      amount: Math.round(amount * 100) / 100,
      date: dateInput.value || todayStr(),
      note: noteInput.value.trim(),
      createdAt: Date.now()
    };
    msg.textContent = '';
    try {
      await addDoc(entriesRef, entry);
      amountInput.value = '';
      noteInput.value = '';
    } catch (e) {
      msg.textContent = 'Could not save — check your connection and try again.';
    }
  });

  // --- Init ---
  document.getElementById('purchaseDate').value = todayStr();
  document.getElementById('settleDate').value = todayStr();
})();
</script>
</body>
</html>
